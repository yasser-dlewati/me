    <!-- Runs before first paint, so it stays inline in <head> rather than in a module (modules run only
         after the page is parsed, by when it may already show). Placed before the stylesheets, which
         an inline script would otherwise wait for -->
    <script>
        (function () {
            var root = document.documentElement;
            function read(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            }

            // A saved Arabic direction, so the page doesn't render left-to-right and flip
            // (js/translation.js applies the language fully once the page loads)
            if (read("language") === "ar") {
                root.lang = "ar";
                root.dir = "rtl";
            }

            // The theme, so dark mode doesn't flash light first. Same choice as js/settings.js (saved
            // theme, else the system's); main.js keeps it in sync afterwards. The browser bar tint
            // values mirror --bg-dark-color, as in applyTheme in main.js
            var theme = read("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            root.setAttribute("data-theme", theme);
            document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#333333" : "#f2f2f2");

            // Slide back the way the privacy page came in, even when this page loads in the other
            // language. pagereveal fires at the first paint, so this listener can't wait for main.js
            addEventListener("pagereveal", function (e) {
                var from = null;
                try {
                    from = sessionStorage.getItem("pageSlideFrom");
                    sessionStorage.removeItem("pageSlideFrom");
                } catch (err) {}
                if (!e.viewTransition || !from) return;
                root.style.setProperty("--page-slide", from === "rtl" ? "-1" : "1");
                e.viewTransition.finished.then(function () {
                    root.style.removeProperty("--page-slide");
                });
            });
        })();
    </script>
